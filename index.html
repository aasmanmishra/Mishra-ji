const D=[
{n:"Engineering Mechanics",d:"How forces make things stay still or move.",b:"Hibbeler – Engineering Mechanics; Beer & Johnston – Vector Mechanics; Meriam & Kraige – Engineering Mechanics",t:[
{h:"Force and Equilibrium",s:"A force is a push or a pull. If a body stays at rest, all forces and turning effects (moments) on it cancel out.",f:"ΣF = 0 , ΣM = 0",u:"Bridges, cranes and building frames are designed so forces balance.",a:"bend",v:"static equilibrium engineering mechanics"},
{h:"Newton’s Laws and F = ma",s:"A body keeps its motion unless a net force acts. More net force gives more acceleration; more mass gives less.",f:"F = m × a",u:"Rocket launch, car acceleration, braking distance.",a:"accel",v:"Newton laws of motion explained"},
{h:"Friction",s:"Friction is the force that resists sliding between two surfaces. It has a maximum value that depends on how hard surfaces press together.",f:"Not yet sliding: f ≤ μs × N. Sliding: f = μk × N",u:"Brakes, tyre grip, clutches. Also wasted energy in machines.",a:"push",v:"friction engineering mechanics"},
{h:"Moment of a Force",s:"A moment is the turning effect of a force about a point.",f:"M = F × d (d = perpendicular distance from the point to the force line)",u:"Spanner, seesaw, door handle.",a:"",v:"moment of a force"},
{h:"Work, Energy and Power",s:"Work is force times the distance moved along the force. Kinetic energy is the energy of motion. Power is work done per second.",f:"W = F × d × cosθ ; KE = ½ × m × v² ; P = W / t",u:"Lifts, vehicles, cranes.",a:"",v:"work energy power physics"},
{h:"Trusses",s:"A truss is a frame of straight bars joined at pins and loaded at the joints, so each bar is either pulled (tension) or pushed (compression). Balance the forces at each joint to find them.",f:"Each joint: ΣFx = 0 , ΣFy = 0 ; simple flat truss: m = 2j − 3",u:"Bridges, roof frames, cranes.",a:"",v:"truss analysis method of joints"},
{h:"Centre of Gravity",s:"The point where the whole weight of a body seems to act. A low and wide body is harder to tip over.",f:"x̄ = Σ(w × x) / Σw",u:"Cars, ships, cranes, bikes.",a:"",v:"centre of gravity explained"},
{h:"Motion in a Straight Line",s:"For constant acceleration a, with starting speed u and final speed v after time t and distance s:",f:"v = u + a×t ; s = u×t + ½×a×t² ; v² = u² + 2×a×s",u:"Braking distance, lifts, falling objects.",a:"accel",v:"equations of motion constant acceleration"},
{h:"Free Body Diagram",s:"Draw the body alone and show every force on it: weights, supports, pushes and pulls. This is the first step of every mechanics problem.",f:"Draw body → show all forces → ΣFx = 0 , ΣFy = 0 , ΣM = 0",u:"Checking loads on a bridge, crane or shelf.",a:"",v:"free body diagram how to draw"},
{h:"Momentum and Impulse",s:"Momentum is mass times velocity. A force acting for a time changes momentum. With no outside force, total momentum stays the same, as in collisions.",f:"p = m×v ; F×Δt = Δp ; m1×u1 + m2×u2 = m1×v1 + m2×v2",u:"Crash tests, rockets, hammers.",a:"",v:"impulse momentum conservation collision"},
{h:"Circular Motion",s:"A body moving in a circle accelerates towards the centre, so it needs a force towards the centre.",f:"a = v² / r ; F = m × v² / r",u:"Road curves, centrifuges, rotating machines.",a:"",v:"centripetal force circular motion"}]},
{n:"Strength of Materials",d:"Will a part bend, stretch or break under load?",b:"Gere & Goodno – Mechanics of Materials; Beer & Johnston – Mechanics of Materials; Hibbeler – Mechanics of Materials",t:[
{h:"Stress and Strain",s:"Stress is load per unit area. Strain is the change in length divided by original length. In the elastic range, stress is proportional to strain (Hooke’s law).",f:"σ = F/A , ε = ΔL/L , σ = E × ε",u:"Choosing the size of a cable, bolt or lift rope.",a:"stretch",v:"stress and strain explained"},
{h:"Bending of Beams",s:"A loaded beam bends. The top and bottom fibres take the highest stress, so I-shaped sections are efficient.",f:"σ = M × y / I (straight beam, elastic range)",u:"Floor beams, bridge girders, aircraft wings.",a:"bend",v:"beam bending stress"},
{h:"Torsion of Shafts",s:"Twisting a shaft creates shear stress, highest at the outer surface.",f:"τ = T × r / J (solid or hollow round shaft)",u:"Car drive shafts, screwdrivers, turbine shafts.",a:"twist",v:"torsion of circular shafts"},
{h:"Shear Stress and Poisson’s Ratio",s:"Shear stress comes from forces that slide layers of material past each other. Poisson’s ratio tells how much a stretched bar gets thinner.",f:"τ = F / A (force parallel to the area) ; ν = − lateral strain / axial strain",u:"Rivets, bolts, rubber parts.",a:"",v:"shear stress and poisson ratio"},
{h:"Shear Force and Bending Moment",s:"At any cut in a beam, shear force is the net sideways force on one side and bending moment is the net turning effect. Their diagrams show where the beam is most loaded.",f:"Simply supported beam, centre load W, span L: max M = W × L / 4",u:"Choosing beam sizes in buildings and bridges.",a:"bend",v:"shear force bending moment diagram"},
{h:"Thin Pressure Vessels",s:"In a thin cylinder with internal pressure p, diameter d and wall thickness t, the ring (hoop) stress is twice the lengthwise stress.",f:"Hoop σ = p×d / (2×t) ; lengthwise σ = p×d / (4×t)",u:"Gas cylinders, boilers, pipes.",a:"",v:"thin cylinder hoop stress"},
{h:"Column Buckling",s:"A long thin column under compression can bend sideways and fail below its crushing strength. Euler’s formula gives the critical load.",f:"Pcr = π² × E × I / (K × L)² (K = 1 for both ends pinned)",u:"Building columns, piston rods, machine legs.",a:"",v:"Euler buckling column"},
{h:"Thermal Stress",s:"If a heated bar is stopped from expanding, stress builds up in it.",f:"σ = E × α × ΔT (bar fully held, α = expansion coefficient)",u:"Railway tracks and pipelines need expansion gaps or joints.",a:"",v:"thermal stress constrained bar"},
{h:"Second Moment of Area",s:"How a cross-section is shaped decides its stiffness in bending. Material far from the centre helps most.",f:"Rectangle: I = b×h³/12 (h = depth) ; Circle: I = π×d⁴/64",u:"Why deep beams and I-sections are stiff.",a:"",v:"second moment of area moment of inertia section"},
{h:"Beam Deflection",s:"How much a beam sags under load. It is stiffer with larger E, larger I and shorter length.",f:"Cantilever, end load: δ = P×L³/(3×E×I) ; Simply supported, centre load: δ = P×L³/(48×E×I)",u:"Floors, bridges, machine tool beds.",a:"bend",v:"beam deflection formula"}]},
{n:"Thermodynamics",d:"Energy, heat, work and engines.",b:"Çengel & Boles – Thermodynamics; P.K. Nag – Engineering Thermodynamics; Moran & Shapiro",t:[
{h:"First Law (energy is conserved)",s:"Energy cannot be created or destroyed. For a closed system, heat added minus work done by the system equals the change in internal energy.",f:"ΔU = Q − W (W = work done BY the system; closed system, no change in motion or height)",u:"Every engine, boiler and refrigerator energy balance.",a:"",v:"first law of thermodynamics"},
{h:"Second Law and Carnot Efficiency",s:"Heat flows by itself from hot to cold. No heat engine working in a cycle can turn all heat into work. The best possible efficiency depends on the two temperatures (in Kelvin).",f:"η = 1 − Tc/Th",u:"Why power plants waste heat; limit for any engine design.",a:"",v:"second law thermodynamics Carnot"},
{h:"Ideal Gas Law",s:"For many gases at normal conditions, pressure, volume and temperature are linked. Temperature must be in Kelvin.",f:"P × V = n × R × T",u:"Tyre pressure, compressed air tanks, engine cylinders.",a:"",v:"ideal gas law"},
{h:"Enthalpy",s:"Enthalpy combines internal energy and flow work. It is used for fluids flowing through turbines, boilers and compressors.",f:"h = u + P × v (per unit mass)",u:"Steam turbine and boiler calculations.",a:"",v:"enthalpy thermodynamics explained"},
{h:"Specific Heat",s:"The heat needed to raise the temperature of a mass of material.",f:"Q = m × c × ΔT",u:"Heating water, designing coolants.",a:"",v:"specific heat capacity"},
{h:"Entropy",s:"Entropy measures how spread out and unusable energy has become. In an isolated system it never decreases, which is why real engines lose work.",f:"ΔS ≥ 0 (isolated system) ; ΔS = Q / T (heat added reversibly at constant T)",u:"Limits of engines, refrigerators and turbines.",a:"",v:"entropy explained simply"},
{h:"Rankine Cycle (Steam Power Plant)",s:"Water is pumped to high pressure, boiled to steam in a boiler, expands in a turbine to make work, then is condensed back to water.",f:"η = (W_turbine − W_pump) / Q_in",u:"Coal, gas and nuclear power plants.",a:"",v:"Rankine cycle steam power plant"},
{h:"Gas Processes",s:"Common ideal-gas processes: constant pressure (isobaric), constant volume (isochoric), constant temperature (isothermal), no heat exchange (adiabatic, reversible).",f:"Isobaric W = P×ΔV ; Isochoric W = 0 ; Isothermal PV = const ; Adiabatic P×V^γ = const",u:"Compressors, engine cylinders.",a:"",v:"thermodynamic processes isothermal adiabatic isobaric"},
{h:"Steady-Flow Energy Equation",s:"For fluid flowing steadily through a turbine, nozzle, compressor or boiler, per unit mass (q = heat added, w = work done by fluid):",f:"q − w = (h2 − h1) + (v2² − v1²)/2 + g×(z2 − z1)",u:"Turbines, nozzles, boilers, compressors.",a:"",v:"steady flow energy equation"},
{h:"Brayton Cycle (Gas Turbine)",s:"Air is compressed, heated by burning fuel, expands through a turbine, then leaves. Ideal efficiency depends on the pressure ratio rp.",f:"η = 1 − 1 / rp^((γ−1)/γ)",u:"Jet engines, gas power plants.",a:"",v:"Brayton cycle gas turbine"}]},
{n:"Fluid Mechanics",d:"How liquids and gases behave at rest and in motion.",b:"Frank White – Fluid Mechanics; Çengel & Cimbala – Fluid Mechanics; R.K. Bansal",t:[
{h:"Pressure in a Fluid",s:"Pressure increases with depth because of the weight of fluid above.",f:"P = ρ × g × h (gauge pressure, i.e. above the air pressure at the surface)",u:"Dams are thicker at the bottom; submarine hull design.",a:"depth",v:"fluid pressure with depth"},
{h:"Continuity Equation",s:"For steady flow of an incompressible fluid, the same volume per second passes every section. A narrow section means faster flow.",f:"A1 × v1 = A2 × v2",u:"Nozzles, garden hose, blood flow in arteries.",a:"pipe",v:"continuity equation fluid"},
{h:"Bernoulli’s Equation",s:"Along a streamline of steady, incompressible, friction-free flow, pressure, speed and height are traded off. Faster flow means lower pressure.",f:"P + ½ρv² + ρgh = constant",u:"Aircraft wing lift, carburettors, flow meters (venturi).",a:"pipe",v:"Bernoulli equation explained"},
{h:"Reynolds Number",s:"Tells if flow is smooth (laminar) or chaotic (turbulent). In a round pipe it is laminar below about 2300 and turbulent above about 4000.",f:"Re = ρ × v × D / μ",u:"Pipe and pump design, blood flow.",a:"",v:"Reynolds number laminar turbulent"},
{h:"Viscosity",s:"Viscosity is a fluid’s resistance to flow. Honey is more viscous than water. Newton’s law links shear stress to how fast the layers slide.",f:"τ = μ × du/dy",u:"Engine oil, lubrication, paints.",a:"",v:"viscosity explained fluid"},
{h:"Buoyancy",s:"A body in a fluid feels an upward force equal to the weight of fluid it pushes aside (Archimedes’ principle).",f:"F_B = ρ_fluid × g × V_displaced",u:"Ships, submarines, balloons.",a:"",v:"Archimedes principle buoyancy"},
{h:"Pipe Friction Losses",s:"Flow in a pipe loses pressure head because of friction with the wall. Longer, narrower and faster flow loses more.",f:"h_f = f × L × v² / (2 × g × D) (Darcy–Weisbach)",u:"Sizing pipes and pumps.",a:"",v:"Darcy Weisbach head loss"},
{h:"Manometer",s:"A U-tube with liquid measures pressure by the height difference between two liquid levels.",f:"ΔP = ρ × g × h",u:"Measuring pressure in pipes and tanks.",a:"",v:"U tube manometer pressure measurement"},
{h:"Force on a Submerged Surface",s:"The total fluid force on a flat surface equals pressure at its centre point times its area (gauge pressure).",f:"F = ρ × g × h_c × A (h_c = depth of the centre of the area)",u:"Dam walls, gates, tank walls.",a:"",v:"hydrostatic force on plane surface"},
{h:"Drag and Lift",s:"A moving body in a fluid feels drag (along the flow) and lift (across the flow). C_D and C_L come from tests.",f:"F_D = ½×ρ×v²×C_D×A ; F_L = ½×ρ×v²×C_L×A",u:"Aircraft wings, car shapes, wind turbines.",a:"",v:"drag and lift force equation"}]},
{n:"Heat Transfer",d:"How heat moves from one place to another.",b:"Incropera – Fundamentals of Heat and Mass Transfer; Çengel – Heat and Mass Transfer",t:[
{h:"Conduction",s:"Heat moves through a solid from hot to cold. Metals conduct well; foam and wool do not.",f:"q = −k × A × dT/dx",u:"Cooking pans, insulation in walls, computer heat sinks.",a:"heat",v:"heat conduction Fourier law"},
{h:"Convection",s:"Heat is carried away by moving fluid, like air or water.",f:"q = h × A × (Ts − T∞)  (Ts = surface, T∞ = fluid temperature)",u:"Car radiator, room fan, cooling of electronics.",a:"",v:"convection heat transfer"},
{h:"Radiation",s:"Hot bodies send out energy as electromagnetic waves. No material is needed. Temperature is in Kelvin.",f:"q = ε × σ × A × T⁴ (energy a surface sends out; T in Kelvin)",u:"Heat from the Sun, furnaces, space radiators.",a:"",v:"thermal radiation Stefan Boltzmann"},
{h:"Thermal Resistance of a Wall",s:"Heat flow through layers is like current through resistors: resistances in series add up.",f:"R = L / (k × A) ; q = ΔT / R_total",u:"Insulating houses, fridges and furnaces.",a:"",v:"thermal resistance conduction wall"},
{h:"Heat Exchangers",s:"A device passing heat from one fluid to another without mixing them.",f:"Q = U × A × ΔT_lm (ΔT_lm = log-mean temperature difference)",u:"Car radiators, AC units, power plant condensers.",a:"",v:"heat exchanger LMTD"},
{h:"Fins",s:"Fins add surface area to a hot surface so more heat can leave by convection.",f:"q = h × A × ΔT, so a bigger A gives more heat loss",u:"Motorbike engine, computer heat sinks.",a:"",v:"fins extended surfaces heat transfer"},
{h:"Conduction in a Pipe Wall",s:"Heat flows outward through a round pipe wall. Insulation thickness matters through the ratio of outer to inner radius.",f:"Q = 2π × k × L × (T1 − T2) / ln(r2/r1)",u:"Insulated steam pipes, boiler tubes.",a:"",v:"conduction cylinder pipe heat transfer"},
{h:"Nusselt Number",s:"A number that compares convection to conduction in the fluid. Tests give formulas for Nu, and then h is found.",f:"Nu = h × L / k",u:"Finding the convection coefficient h for design.",a:"",v:"Nusselt number convection"}]},
{n:"Theory of Machines",d:"Motion of gears, links, cams and mechanisms.",b:"S.S. Rattan – Theory of Machines; Uicker, Pennock & Shigley – Theory of Machines and Mechanisms",t:[
{h:"Slider-Crank Mechanism",s:"A rotating crank, a connecting rod and a sliding piston change rotation into back-and-forth motion, or the reverse.",f:"Stroke = 2 × crank radius (in-line slider-crank)",u:"Petrol and diesel engines, compressors, pumps.",a:"crank",v:"slider crank mechanism"},
{h:"Gears and Gear Ratio",s:"Meshing teeth pass motion between shafts. The bigger gear turns slower but with more torque.",f:"N1/N2 = Z2/Z1 (N = speed, Z = teeth)",u:"Car gearbox, watches, bicycle gears.",a:"gears",v:"gear ratio explained"},
{h:"Cams and Followers",s:"A shaped rotating cam pushes a follower in a planned motion.",f:"Follower lift set by cam profile",u:"Engine valves, sewing machines, toys.",a:"",v:"cam and follower mechanism"},
{h:"Types of Gears",s:"Spur: straight teeth, parallel shafts. Helical: slanted teeth, smoother and quieter. Bevel: shafts meet at an angle. Worm: gives a large speed reduction with shafts at 90°.",f:"Worm gear ratio = teeth on wheel / number of starts on worm",u:"Gearboxes, steering, lifts.",a:"",v:"types of gears spur helical bevel worm"},
{h:"Belt Drives",s:"A belt passes motion between pulleys. With no slip, the smaller pulley turns faster.",f:"N1 / N2 = D2 / D1",u:"Fan belts, lathes, mills.",a:"",v:"belt drive velocity ratio"},
{h:"Flywheel",s:"A heavy wheel that stores rotational energy and smooths out speed changes.",f:"E = ½ × I × ω² ; ΔE = ½ × I × (ω_max² − ω_min²)",u:"Engines, punching presses.",a:"",v:"flywheel energy fluctuation"},
{h:"Four-Bar Linkage",s:"Four rigid links joined by four pins. Grashof’s rule says whether at least one link can turn a full circle (s = shortest, l = longest, p and q = the other two).",f:"s + l ≤ p + q",u:"Windscreen wipers, car suspensions, pliers.",a:"",v:"four bar linkage Grashof"},
{h:"Gear Trains",s:"In a simple train, the speed ratio depends only on first and last gear teeth; idler gears only change direction. In a compound train, multiply the ratios.",f:"N_in / N_out = Z_out / Z_in ; compound: product of (driven teeth / driver teeth)",u:"Gearboxes, clocks.",a:"gears",v:"gear train compound simple"},
{h:"Static Balancing",s:"A rotating system is balanced when the mass moments about the axis cancel. For masses in one plane, the vector sum of m × r must be zero.",f:"Σ(m × r) = 0 (vector sum)",u:"Wheels, fans, crankshafts.",a:"",v:"static balancing rotating masses"}]},
{n:"Machine Design",d:"Choosing sizes and materials so parts do not fail.",b:"Shigley – Mechanical Engineering Design; V.B. Bhandari – Design of Machine Elements",t:[
{h:"Factor of Safety",s:"The ratio of what the part can carry to what it actually carries. It gives a margin for unknowns.",f:"FoS = strength / working stress",u:"Lift cables, pressure vessels, bridges.",a:"stretch",v:"factor of safety machine design"},
{h:"Fatigue Failure",s:"Parts under repeated loading can crack and break at stresses well below their static strength.",f:"Look up S–N curve and endurance limit",u:"Aircraft structures, axles, crankshafts.",a:"bend",v:"fatigue failure S-N curve"},
{h:"Bolts, Bearings and Shafts",s:"Bolts clamp parts, bearings reduce friction between moving parts, shafts carry power.",f:"Sizes chosen from load and standards",u:"Almost every machine.",a:"",v:"machine elements bearings bolts"},
{h:"Springs",s:"A spring’s stiffness (rate) is the force per unit compression or stretch. For a round-wire helical spring, d = wire diameter, D = coil diameter, n = active coils, G = shear modulus.",f:"k = F / x ; k = G × d⁴ / (8 × D³ × n)",u:"Suspensions, pens, valves.",a:"spring",v:"helical spring stiffness design"},
{h:"Power Transmitted by a Shaft",s:"Power equals torque times angular speed.",f:"P = T × ω (P in W, T in N·m, ω in rad/s) ; ω = 2π × N / 60",u:"Sizing shafts in any rotating machine.",a:"",v:"power transmitted by shaft torque"},
{h:"Stress Concentration",s:"Holes, notches and sharp corners raise stress locally. Smooth fillets reduce it.",f:"Kt = σ_max / σ_nominal",u:"Shafts with keyways, plates with holes.",a:"",v:"stress concentration factor"},
{h:"Failure Theories",s:"Rules to predict yielding under combined stress. Maximum shear (Tresca): yield when the largest shear stress reaches σy/2. Von Mises: yield when the equivalent stress reaches σy.",f:"Von Mises (2D principal): σ_vm = √(σ1² − σ1×σ2 + σ2²)",u:"Designing shafts and pressure parts.",a:"",v:"Tresca von Mises failure theory"},
{h:"Rolling Bearing Life",s:"Rated life L10 is the number of revolutions that 90% of identical bearings survive. C = rated load, P = actual load.",f:"L10 = (C / P)^3 million revolutions (ball bearings)",u:"Selecting bearings for gearboxes and motors.",a:"",v:"bearing L10 life calculation"}]},
{n:"Manufacturing Processes",d:"How parts are actually made.",b:"Groover – Fundamentals of Modern Manufacturing; Kalpakjian & Schmid – Manufacturing Engineering and Technology",t:[
{h:"Casting",s:"Melted metal is poured into a mould and left to solidify.",f:"Shape comes from the mould",u:"Engine blocks, pipes, statues.",a:"",v:"casting process"},
{h:"Forming (Forging, Rolling)",s:"Solid metal is shaped by force without melting.",f:"Shape changed by pressing or rolling",u:"Steel sheets, crankshafts, spanners.",a:"",v:"metal forming forging rolling"},
{h:"Machining and Welding",s:"Machining cuts material away (turning, milling, drilling). Welding joins pieces using heat.",f:"Cutting speed V = π × D × N (turning: D = work diameter, N = rev/min)",u:"Precision parts, car bodies, pipelines.",a:"",v:"machining turning milling welding"},
{h:"3D Printing (Additive Manufacturing)",s:"Parts are built layer by layer from a digital model, instead of cutting material away.",f:"No formula: model → slice → print layers",u:"Prototypes, medical implants, aircraft parts.",a:"",v:"additive manufacturing 3D printing"},

{n:"Materials Science",d:"What materials are made of and why they behave as they do.",b:"Callister – Materials Science and Engineering; Askeland – Science and Engineering of Materials",t:[

{h:"Stress-Strain Curve",s:"A tensile test shows the elastic range, yield point, ultimate strength and fracture.",f:"E = slope of the elastic part",u:"Checking steel quality before use.",a:"stretch",v:"stress strain curve tensile test"},

{h:"Hardness Tests",s:"Hardness is resistance to being dented. Brinell, Rockwell and Vickers tests press an indenter into the material and measure the result.",f:"Brinell: load divided by indent surface area",u:"Checking heat-treated parts.",a:"",v:"Brinell Rockwell Vickers hardness test"},
{h:"Corrosion",s:"Iron rusts when oxygen and water are present. Paint, galvanizing (zinc coating) and stainless alloys protect it.",f:"Rust needs: iron + oxygen + water",u:"Pipes, bridges, ships, cars.",a:"",v:"corrosion rusting prevention galvanizing"},
{h:"Crystal Structures",s:"Metal atoms sit in repeating patterns. BCC, FCC and HCP are the most common. FCC metals are usually more ductile.",f:"BCC (iron at room temperature) 2 atoms/cell ; FCC (aluminium, copper) 4 ; HCP (magnesium, zinc) 6",u:"Explains why metals behave differently.",a:"",v:"BCC FCC HCP crystal structure"},
{h:"Heat Treatment Types",s:"Annealing: slow cool, soft. Normalising: air cool, refined grains. Hardening: quench, hard but brittle. Tempering: reheat after quenching to reduce brittleness.",f:"Harden (quench) → then temper",u:"Tools, gears, springs, shafts.",a:"",v:"annealing normalising hardening tempering"},
{h:"Polymers",s:"Thermoplastics soften when heated and can be remelted (nylon, PVC). Thermosets harden permanently (epoxy). Elastomers are rubbery.",f:"Thermoplastic: remeltable ; Thermoset: not remeltable",u:"Bottles, gears, tyres, adhesives.",a:"",v:"thermoplastic vs thermoset"}]},
{n:"Engineering Drawing",d:"The language engineers use to describe parts.",b:"N.D. Bhatt – Engineering Drawing; Giesecke et al. – Technical Drawing",t:[
{h:"Orthographic Projection",s:"A 3D part is shown as flat views: front, top and side. First-angle projection is common in India and Europe; third-angle in the USA.",f:"Front + Top + Side views",u:"Every factory drawing.",a:"",v:"orthographic projection first angle third angle"},
{h:"Dimensioning and Tolerance",s:"Dimensions give sizes. Tolerance says how much a size may vary and still work.",f:"Size ± tolerance",u:"Making parts from different factories fit together.",a:"",v:"dimensioning and tolerancing basics"},
{h:"Sectional Views",s:"A part is imagined cut open to show inside details. Cut surfaces are shown with thin 45° hatching lines.",f:"Cut surface → hatching at 45°",u:"Showing holes and cavities in engine parts.",a:"",v:"sectional views engineering drawing"},
{h:"Scale",s:"Large parts are drawn smaller and small parts larger. A 1:2 drawing is half size; 2:1 is double size.",f:"Scale = drawing size : actual size",u:"Machine drawings, building plans.",a:"",v:"engineering drawing scale"},
{h:"Isometric View",s:"A single 3D-looking picture. The three axes are drawn so the two sloping ones are at 30° to the horizontal.",f:"Axes: vertical, and two at 30° to horizontal",u:"Assembly instructions, quick sketches.",a:"",v:"isometric drawing basics"},
{h:"Line Types",s:"Different lines carry different meaning: thick continuous = visible edges, thin dashed = hidden edges, thin chain = centre lines, thin continuous = dimension lines.",f:"Thick = seen ; dashed = hidden ; chain = centre",u:"Reading any drawing.",a:"",v:"engineering drawing line types"},
{h:"Limits and Fits",s:"A fit says how a shaft sits in a hole. Clearance: shaft smaller than hole (turns freely). Interference: shaft larger (press fit). Transition: may be either.",f:"Clearance = hole − shaft (positive) ; Interference = shaft − hole (positive)",u:"Bearings on shafts, gears on shafts.",a:"",v:"limits and fits clearance interference"},
{h:"Assembly Drawing",s:"An assembly drawing shows how parts fit together with item numbers and a parts list. A part drawing gives everything needed to make one part.",f:"Assembly = parts + item numbers + parts list",u:"Machine manuals and factories.",a:"",v:"assembly drawing and part drawing"}]},
{n:"IC Engines and Refrigeration",d:"Engines that burn fuel and machines that cool.",b:"Ganesan – Internal Combustion Engines; Heywood – Internal Combustion Engine Fundamentals; Çengel – Thermodynamics",t:[
{h:"Four-Stroke Petrol (Otto) Engine",s:"Four piston strokes make one cycle: suction, compression, power, exhaust. The crankshaft turns two times per cycle.",f:"Ideal Otto efficiency = 1 − 1/r^(γ−1)  (r = compression ratio, γ ≈ 1.4 for air)",u:"Cars, motorbikes, generators.",a:"crank",v:"four stroke engine working"},
{h:"Refrigeration Cycle",s:"A refrigerant is compressed, cooled, expanded and then absorbs heat from the cold space. Work is used to move heat from cold to hot.",f:"COP = Q_cold / W (refrigerator)",u:"Fridges, air conditioners, cold storage.",a:"",v:"vapour compression refrigeration cycle"},
{h:"Petrol vs Diesel Engine",s:"Petrol: air and fuel are mixed and a spark plug ignites them. Diesel: only air is compressed, fuel is sprayed in, and the hot air ignites it. Diesel engines use higher compression ratios.",f:"No formula: compare how fuel is ignited",u:"Cars (petrol), trucks and generators (diesel).",a:"",v:"petrol vs diesel engine difference"},
{h:"Engine Power and Efficiency",s:"Brake power is the power at the shaft, measured with a dynamometer. Indicated power is the power inside the cylinder.",f:"BP = 2π × N × T / 60 (N in rpm, T in N·m, BP in W) ; mechanical efficiency = BP / IP",u:"Rating and testing engines.",a:"",v:"brake power indicated power mechanical efficiency"},
{h:"Heat Pump",s:"A heat pump is a refrigerator used to heat. It moves heat from cold outside to warm inside using work.",f:"COP_heating = Q_hot / W = COP_refrigerator + 1",u:"Home heating, hot water.",a:"",v:"heat pump COP working"},
{h:"Two-Stroke Engine",s:"A power stroke happens every crankshaft revolution. It is simple and light but burns fuel less cleanly than most four-stroke engines.",f:"One cycle = 1 crankshaft revolution",u:"Chainsaws, small scooters, outboard motors.",a:"crank",v:"two stroke engine working"},
{h:"Diesel Cycle",s:"Air is compressed, fuel is injected and burns at roughly constant pressure. r = compression ratio, ρ = cut-off ratio.",f:"η = 1 − (1 / r^(γ−1)) × (ρ^γ − 1) / (γ × (ρ − 1))",u:"Trucks, ships, generators.",a:"",v:"diesel cycle efficiency"},
{h:"Engine Emissions",s:"CO comes from incomplete burning. HC is unburnt fuel. NOx forms at high temperature. Diesel also makes soot. A catalytic converter reduces CO, HC and NOx.",f:"NOx rises with combustion temperature",u:"Meeting pollution rules.",a:"",v:"engine emissions CO HC NOx catalytic converter"}]},
{n:"Vibrations",d:"How machines and structures shake, and how to control it.",b:"S.S. Rao – Mechanical Vibrations; Thomson – Theory of Vibration with Applications; Kelly – Mechanical Vibrations",t:[
{h:"Free Vibration (Spring and Mass)",s:"A mass on a spring, pulled and released, swings at its own natural frequency. A stiffer spring raises it; a bigger mass lowers it.",f:"ωn = √(k/m) rad/s ; f = ωn / 2π Hz",u:"Car suspension, building sway, guitar strings.",a:"spring",v:"free vibration spring mass system"},
{h:"Damping",s:"Damping removes energy so vibration dies out. Damping ratio ζ below 1: still oscillates but fades. ζ = 1 (critical): returns fastest without oscillating. Above 1: slow return, no oscillation.",f:"ζ = c / (2 × √(k × m))",u:"Shock absorbers, door closers.",a:"damped",v:"damping ratio underdamped critically damped"},
{h:"Resonance",s:"If a push repeats close to the natural frequency, the swings grow large. Designers keep machine speeds away from natural frequencies.",f:"Frequency ratio r = ω / ωn ; resonance near r = 1",u:"Washing machine shaking at one speed, rotating shafts, tall buildings.",a:"resonance",v:"resonance mechanical vibration"},
{h:"Vibration Isolation",s:"Soft mounts keep a machine’s shaking away from the floor. They work only when the machine’s frequency is well above the mount’s natural frequency.",f:"Isolation starts when r = ω / ωn > √2",u:"Engine mounts, AC units on roofs.",a:"",v:"vibration isolation transmissibility"},
{h:"Magnification Factor",s:"How much bigger the vibration is than the static deflection. For small damping, the peak at resonance is about 1/(2ζ).",f:"Peak magnification ≈ 1 / (2×ζ) (small ζ)",u:"More damping means safer passage through resonance.",a:"resonance",v:"magnification factor resonance damping"},
{h:"Critical Speed of a Shaft",s:"A rotating shaft whirls violently at a speed equal to its natural frequency. Run well away from it.",f:"ω_c = √(k / m)",u:"Turbines, pump shafts, motors.",a:"",v:"critical speed of shaft whirling"}]},
{n:"Control Systems",d:"Making machines hold a speed, position or temperature by themselves.",b:"Ogata – Modern Control Engineering; Nise – Control Systems Engineering; Kuo – Automatic Control Systems",t:[
{h:"Open and Closed Loop",s:"Open loop: the controller acts without checking the result (a timer-based washing machine). Closed loop: the output is measured and fed back so errors get corrected (a thermostat).",f:"Error = desired value − measured value",u:"AC thermostat, cruise control, geyser.",a:"",v:"open loop closed loop control system"},
{h:"Transfer Function",s:"A transfer function links output to input using the Laplace transform, with zero starting conditions. Feedback changes the overall behaviour.",f:"G(s) = Output(s) / Input(s) ; negative feedback loop: G / (1 + G × H)",u:"Motor speed control, aircraft autopilot.",a:"",v:"transfer function control systems"},
{h:"PID Controller",s:"Three actions on the error e: P reacts to the present error, I to the error built up over time, D to how fast the error is changing.",f:"u = Kp × e + Ki × ∫e dt + Kd × de/dt",u:"Drone stability, temperature control, robot arms.",a:"",v:"PID controller explained"},
{h:"Stability",s:"A system is stable if it settles down after a disturbance. In terms of the transfer function, every pole must have a negative real part.",f:"Stable if all poles have negative real parts",u:"Aircraft, cars, robots.",a:"",v:"control system stability poles"},
{h:"First-Order Response",s:"A simple system (heating a tank, charging a capacitor) responds to a sudden input with a smooth rise. τ is the time constant.",f:"y = 1 − e^(−t/τ) ; 63.2% reached at t = τ",u:"Temperature control, motor speed.",a:"",v:"first order system time constant step response"},
{h:"Second-Order Response",s:"Many systems overshoot and settle. Overshoot depends on the damping ratio ζ (underdamped, 0 < ζ < 1).",f:"%Overshoot = 100 × e^(−ζ×π / √(1−ζ²))",u:"Robot arms, suspensions, positioning systems.",a:"damped",v:"second order system overshoot damping ratio"}]},
{n:"Mechatronics",d:"Mechanical, electrical and computer ideas working together.",b:"W. Bolton – Mechatronics; Alciatore & Histand – Introduction to Mechatronics and Measurement Systems",t:[
{h:"Sensors, Controller, Actuators",s:"Sensors measure (temperature, position, speed). A controller such as a microcontroller decides. Actuators such as motors and valves act.",f:"Sensor → Controller → Actuator",u:"Anti-lock brakes, robots, washing machines.",a:"",v:"mechatronics sensors actuators controller"},
{h:"DC Motor Basics",s:"Current in a magnetic field gives torque. A spinning motor also produces a back voltage that rises with speed.",f:"T = Kt × I ; back emf E = Ke × ω",u:"Robot joints, fans, power windows.",a:"",v:"DC motor working principle"},
{h:"Degrees of Freedom",s:"The number of independent motions a body can have. A free rigid body in space has 6: three movements along x, y, z and three turns about them.",f:"Free rigid body in 3D: DOF = 6",u:"Robot arm design, aircraft motion.",a:"",v:"degrees of freedom mechanism robot"},
{h:"Stepper Motor",s:"A motor that turns in fixed steps, so position is controlled by counting pulses.",f:"Step angle = 360° / steps per revolution (200 steps gives 1.8°)",u:"3D printers, CNC machines.",a:"",v:"stepper motor working"},
{h:"PWM Speed Control",s:"A microcontroller switches power on and off quickly. The longer it is on, the higher the average voltage.",f:"V_avg = duty cycle × V_supply",u:"Motor speed, LED dimming.",a:"",v:"PWM pulse width modulation motor"},
{h:"Hydraulic and Pneumatic Actuators",s:"Fluid in a cylinder pushes a piston. Hydraulic uses oil for big forces. Pneumatic uses air for quick, clean motion.",f:"F = P × A",u:"Excavators, brakes, factory automation.",a:"",v:"hydraulic vs pneumatic actuators"}]},
{n:"Measurements and Metrology",d:"Measuring correctly and knowing how wrong a reading can be.",b:"Beckwith – Mechanical Measurements; R.K. Jain – Engineering Metrology; Doebelin – Measurement Systems",t:[
{h:"Accuracy, Precision and Error",s:"Accuracy: how close a reading is to the true value. Precision: how close repeated readings are to each other. A tool can be precise but not accurate.",f:"Error = measured value − true value",u:"Calibrating scales, gauges and machines.",a:"",v:"accuracy vs precision measurement"},
{h:"Vernier Caliper and Micrometer",s:"Least count is the smallest reading a tool can show. Reading = main scale reading + (vernier division × least count).",f:"Vernier LC = smallest main scale division / number of vernier divisions ; Micrometer LC = pitch / circular scale divisions",u:"Checking shaft diameters in workshops.",a:"",v:"vernier caliper micrometer least count"},
{h:"Strain Gauge",s:"A thin metal foil whose resistance changes slightly when it is stretched. It measures strain, and from that, stress.",f:"ΔR / R = GF × ε (GF = gauge factor)",u:"Weighing scales, load cells, testing bridges.",a:"",v:"strain gauge working principle"},
{h:"Temperature Sensors",s:"A thermocouple makes a small voltage from two joined metals. An RTD is a metal wire whose resistance rises with temperature. A thermistor is a semiconductor whose resistance changes sharply.",f:"RTD: resistance increases as temperature increases",u:"Furnaces, engines, ovens.",a:"",v:"thermocouple RTD thermistor difference"},
{h:"Go / No-Go Gauges",s:"A quick check of a size. The Go end must fit. The No-Go end must not fit. If both are true, the size is within tolerance.",f:"Go fits and No-Go does not fit = accepted",u:"Checking holes and shafts in production.",a:"",v:"go no go gauge"},
{h:"Surface Roughness",s:"Roughness is the tiny peaks and valleys on a surface. Ra is the average height deviation from the mean line, measured in micrometres.",f:"Ra = average of |height deviations| from the mean line",u:"Bearing surfaces, cylinder walls.",a:"",v:"surface roughness Ra"}]},
{n:"Pumps and Turbines",d:"Machines that move liquids and machines that take power from them.",b:"R.K. Bansal – Fluid Mechanics and Hydraulic Machines; Çengel & Cimbala – Fluid Mechanics; White – Fluid Mechanics",t:[
{h:"Centrifugal Pump",s:"A spinning impeller throws liquid outward, raising its pressure and moving it through pipes. The power the liquid receives is:",f:"P = ρ × g × Q × H (Q = flow in m³/s, H = head in m)",u:"Home water supply, farms, power plants.",a:"",v:"centrifugal pump working"},
{h:"Water Turbines",s:"Turbines turn water energy into shaft power. Pelton: high head, small flow (impulse). Francis: medium head. Kaplan: low head, large flow (reaction).",f:"P = η × ρ × g × Q × H",u:"Hydroelectric power plants.",a:"",v:"pelton francis kaplan turbine"},
{h:"Cavitation",s:"If the pressure inside a pump falls below the liquid’s vapour pressure, bubbles form, then collapse and damage the metal. Keep the suction pressure high enough.",f:"NPSH available must be greater than NPSH required",u:"Pump installation, ship propellers.",a:"",v:"pump cavitation NPSH"},
{h:"Pump Affinity Laws",s:"For the same pump, changing the speed N changes flow, head and power in these ways:",f:"Q ∝ N ; H ∝ N² ; P ∝ N³",u:"Variable-speed pumps saving energy.",a:"",v:"pump affinity laws"},
{h:"Pelton Wheel",s:"A jet of water hits buckets on a wheel and drives it. The jet speed comes from the head (Cv ≈ 0.98).",f:"V_jet = Cv × √(2×g×H)",u:"High mountain hydro plants.",a:"",v:"Pelton wheel working"},
{h:"Hydraulic Press",s:"Pressure in a closed fluid is the same everywhere, so a small force on a small piston gives a big force on a large piston.",f:"F2 / F1 = A2 / A1",u:"Presses, car lifts, jacks.",a:"",v:"Pascal law hydraulic press"}]},
{n:"Engineering Mathematics",d:"The maths tools used in every subject above.",b:"Kreyszig – Advanced Engineering Mathematics; B.S. Grewal – Higher Engineering Mathematics",t:[
{h:"Derivative",s:"The derivative is the rate of change, the slope of a curve. Velocity is the derivative of position; acceleration is the derivative of velocity.",f:"d/dx (xⁿ) = n × xⁿ⁻¹",u:"Finding speed from distance, finding the point of maximum stress.",a:"",v:"derivative explained"},
{h:"Integral",s:"The integral adds up tiny pieces, the area under a curve. It reverses differentiation.",f:"∫ xⁿ dx = xⁿ⁺¹ / (n+1) + C (n ≠ −1)",u:"Work done, centre of gravity, total flow.",a:"",v:"integral explained"},
{h:"Matrices and Equations",s:"Matrices write many linear equations together as A × x = b. Used for force balances in trusses.",f:"A × x = b ; x = A⁻¹ × b (when det A ≠ 0)",u:"Truss analysis, computer simulations (FEA).",a:"",v:"matrices solving linear equations"},
{h:"Simple Differential Equation",s:"Many changes follow “rate of change is proportional to the amount”. The solution is an exponential.",f:"dy/dt = −k×y gives y = y0 × e^(−k×t)",u:"Cooling of a hot part, decay, damping.",a:"",v:"first order differential equation exponential decay"},
{h:"Vectors",s:"A vector has size and direction. The dot product gives how much two vectors point the same way; the cross product gives a vector at 90° to both.",f:"A·B = |A||B|cosθ ; |A×B| = |A||B|sinθ",u:"Forces, moments (M = r × F), velocity.",a:"",v:"vectors dot product cross product"},
{h:"Laplace Transform",s:"Turns differential equations into algebra, which is easier to solve. Widely used in control and vibrations.",f:"L{e^(a×t)} = 1 / (s − a) ; L{f′} = s×F(s) − f(0)",u:"Control systems, circuits, vibrations.",a:"",v:"Laplace transform basics"},
{h:"Newton–Raphson Method",s:"Finds a root of f(x) = 0 step by step, starting from a guess.",f:"x_new = x − f(x) / f′(x)",u:"Solving equations that have no neat formula.",a:"",v:"Newton Raphson method"},
{h:"Mean and Standard Deviation",s:"The mean is the average. Standard deviation says how spread out the values are.",f:"Mean = Σx / n ; s = √( Σ(x − mean)² / (n − 1) )",u:"Quality control, test results.",a:"",v:"mean standard deviation explained"}]}
];

const A={
spring(g,t,w,h){sp(g,20*Math.sin(t*3),"free swing")},
damped(g,t,w,h){const u=t%6;sp(g,28*Math.exp(-u*.6)*Math.cos(u*5),"damping: fades")},
resonance(g,t,w,h){const u=t%6;sp(g,Math.min(4+u*5,30)*Math.sin(t*4),"resonance: grows")},
push(g,t,w,h){const x=20+((t*40)%170);g.fillRect(0,h-30,w,3);g.strokeRect(x,h-70,60,40);arrow(g,x+60,h-50,x+100,h-50);arrow(g,x+60,h-28,x+20,h-28);g.fillText("push",x+64,h-56);g.fillText("friction (equal: steady speed)",8,h-8)},
accel(g,t,w,h){const u=t%3,x=20+.5*38*u*u,v=38*u*.3;g.fillRect(0,h-30,w,3);g.strokeRect(x,h-70,50,40);arrow(g,x-35,h-50,x,h-50);if(v>3)arrow(g,x+25,h-85,x+25+v,h-85);g.fillText("constant force: speed keeps growing",8,h-8)},
twist(g,t,w,h){const tw=(Math.sin(t*2)+1)/2*30;g.strokeRect(60,35,180,50);g.setLineDash([4,4]);g.beginPath();g.moveTo(60,35);g.lineTo(240,35);g.stroke();g.setLineDash([]);g.lineWidth=3;g.beginPath();g.moveTo(60,35);g.lineTo(240,35+tw);g.stroke();g.lineWidth=1.5;g.fillText("fixed",12,64);g.fillText("T",246,64);g.fillText("line on shaft tilts when twisted",8,h-8)},
depth(g,t,w,h){g.beginPath();g.moveTo(60,10);g.lineTo(60,100);g.lineTo(240,100);g.lineTo(240,10);g.stroke();g.globalAlpha=.15;g.fillRect(60,10,180,90);g.globalAlpha=1;const k=1+.08*Math.sin(t*3);[25,50,75,95].forEach(y=>arrow(g,60+(10+(y-10)*.8)*k,y,60,y));g.fillText("deeper = more pressure",8,h-8)},
pendulum(g,t,w,h){const a=.6*Math.cos(t*3),px=w/2,py=15,L=85,x=px+L*Math.sin(a),y=py+L*Math.cos(a);g.beginPath();g.moveTo(px,py);g.lineTo(x,y);g.stroke();g.beginPath();g.arc(x,y,12,0,7);g.fill();g.fillText("swings back and forth",8,h-8)},
stretch(g,t,w,h){const e=(Math.sin(t*2)+1)/2*30,L=120+e;g.strokeRect(w/2-L/2,h/2-12,L,24);arrow(g,w/2+L/2,h/2,w/2+L/2+30,h/2);arrow(g,w/2-L/2,h/2,w/2-L/2-30,h/2);g.fillText("bar stretches under load",8,h-8)},
bend(g,t,w,h){const s=(Math.sin(t*2)+1)/2*22;g.beginPath();for(let i=0;i<=40;i++){const x=40+i*5.5,y=50+s*Math.sin(Math.PI*i/40);i?g.lineTo(x,y):g.moveTo(x,y)}g.lineWidth=5;g.stroke();g.lineWidth=1.5;g.fillText("▲",34,76);g.fillText("▲",250,76);arrow(g,w/2,5,w/2,38+s);g.fillText("beam bends under load",8,h-8)},
pipe(g,t,w,h,c){const H=x=>x<10?40:x<100?40-(x-10)*25/90:x<=200?15:x<290?15+(x-200)*25/90:40;g.beginPath();g.moveTo(10,20);g.lineTo(100,45);g.lineTo(200,45);g.lineTo(290,20);g.moveTo(10,100);g.lineTo(100,75);g.lineTo(200,75);g.lineTo(290,100);g.stroke();if(!c.p){c.p=[];for(let i=0;i<16;i++)c.p.push({x:10+i*17.5,f:((i*5)%7-3)/4.5});c.lt=t}const dt=Math.min(t-c.lt,.1);c.lt=t;c.p.forEach(q=>{q.x+=30*dt*(40/H(q.x));if(q.x>290)q.x=10;g.beginPath();g.arc(q.x,60+q.f*H(q.x),3,0,7);g.fill()});g.fillText("narrow part: faster flow",8,h-8)},
heat(g,t,w,h){for(let i=0;i<40;i++){const x=20+(i%20)*13.5,y=35+Math.floor(i/20)*35,amp=6*(1-(x-20)/270)+1;g.fillStyle=`hsl(${20+(x-20)*.6},85%,55%)`;g.beginPath();g.arc(x+amp*Math.sin(t*9+i),y+amp*Math.cos(t*7+i*2),5,0,7);g.fill()}g.fillStyle=g.strokeStyle;g.fillText("HOT → COLD: heat flows along the bar",8,h-8)},
gears(g,t,w,h){gear(g,90,60,36,12,t*2);gear(g,90+36+18+2,60,18,6,-t*4+.26);g.fillText("small gear spins 2× faster",8,h-8)},
crank(g,t,w,h){const cx=70,cy=60,r=22,a=t*3,px=cx+r*Math.cos(a),py=cy+r*Math.sin(a),L=80,x=px+Math.sqrt(L*L-(py-cy)**2);g.beginPath();g.arc(cx,cy,r,0,7);g.stroke();g.beginPath();g.moveTo(cx,cy);g.lineTo(px,py);g.lineTo(x,cy);g.lineWidth=3;g.stroke();g.lineWidth=1.5;g.fillRect(x,cy-14,26,28);g.strokeRect(150,cy-20,140,40);g.fillText("piston moves back and forth",8,h-8)}};
function sp(g,d,l){const mt=60+d;g.fillRect(190,6,100,4);g.beginPath();g.moveTo(240,10);for(let i=1;i<=10;i++)g.lineTo(240+(i%2?12:-12),10+(mt-10)*i/11);g.lineTo(240,mt);g.stroke();g.fillRect(220,mt,40,22);g.fillText(l,8,18)}
function arrow(g,x1,y1,x2,y2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);const a=Math.atan2(y2-y1,x2-x1);g.lineTo(x2-8*Math.cos(a-.4),y2-8*Math.sin(a-.4));g.moveTo(x2,y2);g.lineTo(x2-8*Math.cos(a+.4),y2-8*Math.sin(a+.4));g.stroke()}
function gear(g,x,y,r,n,rot){g.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,rr=i%2?r-5:r+4;g.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a))}g.closePath();g.stroke();g.beginPath();g.arc(x,y,3,0,7);g.fill()}
